  <script>
  let cart = [];
  const cartSidebar = document.getElementById('cart-sidebar');
  const cartOverlay = document.getElementById('cart-overlay');
  const cartItems = document.getElementById('cart-items');
  const cartEmpty = document.getElementById('cart-empty');
  const cartFooter = document.getElementById('cart-footer');
  const cartTotal = document.getElementById('cart-total');
  const cartCountEl = document.getElementById('cart-count');
  const checkoutModal = document.getElementById('checkout-modal');
  const mobileMenu = document.getElementById('mobile-menu');
  const mobileMenuOverlay = document.getElementById('mobile-menu-overlay');
  const backToTop = document.getElementById('back-to-top');

  // Mobile menu
  document.getElementById('mobile-menu-toggle').addEventListener('click', () => {
    mobileMenu.classList.add('open');
    mobileMenuOverlay.classList.add('open');
  });
  mobileMenuOverlay.addEventListener('click', closeMobileMenu);
  function closeMobileMenu() {
    mobileMenu.classList.remove('open');
    mobileMenuOverlay.classList.remove('open');
  }

  // Back to top
  window.addEventListener('scroll', () => {
    backToTop.classList.toggle('visible', window.scrollY > 600);
  });
  backToTop.addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));

  // Cart
  function openCart() { cartSidebar.classList.add('open'); cartOverlay.classList.add('open'); }
  function closeCart() { cartSidebar.classList.remove('open'); cartOverlay.classList.remove('open'); }
  document.getElementById('cart-toggle').addEventListener('click', openCart);
  document.getElementById('cart-close').addEventListener('click', closeCart);
  cartOverlay.addEventListener('click', closeCart);

  document.querySelectorAll('.add-to-cart-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const card = btn.closest('.product-card');
      const name = card.dataset.name;
      const price = parseFloat(card.dataset.price);
      const existing = cart.find(i => i.name === name);
      if (existing) { existing.qty++; } else { cart.push({ name, price, qty: 1 }); }
      renderCart();
      openCart();
    });
  });

  function renderCart() {
    const total = cart.reduce((s, i) => s + i.price * i.qty, 0);
    const count = cart.reduce((s, i) => s + i.qty, 0);
    cartCountEl.textContent = count;
    cartCountEl.classList.toggle('hidden', count === 0);
    cartEmpty.classList.toggle('hidden', cart.length > 0);
    cartFooter.classList.toggle('hidden', cart.length === 0);
    cartTotal.textContent = 'R$ ' + total.toFixed(2).replace('.', ',');
    cartItems.innerHTML = '';
    cart.forEach((item, idx) => {
      const div = document.createElement('div');
      div.className = 'flex items-center justify-between bg-neutral-900 rounded-lg p-3';
      div.innerHTML = `<div class="flex-1 min-w-0"><p class="text-sm font-medium truncate">${item.name}</p><p class="text-xs gold">R$ ${item.price.toFixed(2).replace('.', ',')}</p></div><div class="flex items-center gap-2 ml-3"><button class="qty-btn w-7 h-7 rounded-full border border-neutral-700 flex items-center justify-center text-sm hover:border-gold" data-idx="${idx}" data-dir="-1">−</button><span class="text-sm w-6 text-center">${item.qty}</span><button class="qty-btn w-7 h-7 rounded-full border border-neutral-700 flex items-center justify-center text-sm hover:border-gold" data-idx="${idx}" data-dir="1">+</button><button class="rm-btn ml-1 text-neutral-500 hover:text-red-400" data-idx="${idx}"><i data-lucide="trash-2" class="w-4 h-4"></i></button></div>`;
      cartItems.appendChild(div);
    });
    lucide.createIcons();
    cartItems.querySelectorAll('.qty-btn').forEach(b => b.addEventListener('click', () => {
      const i = parseInt(b.dataset.idx);
      cart[i].qty += parseInt(b.dataset.dir);
      if (cart[i].qty < 1) cart.splice(i, 1);
      renderCart();
    }));
    cartItems.querySelectorAll('.rm-btn').forEach(b => b.addEventListener('click', () => {
      cart.splice(parseInt(b.dataset.idx), 1);
      renderCart();
    }));
  }

  // Checkout
  document.getElementById('checkout-btn').addEventListener('click', () => {
    closeCart();
    checkoutModal.classList.remove('hidden');
    document.getElementById('checkout-form').classList.remove('hidden');
    document.getElementById('checkout-success').classList.add('hidden');
  });
  document.getElementById('checkout-close').addEventListener('click', () => checkoutModal.classList.add('hidden'));
  document.getElementById('checkout-overlay').addEventListener('click', () => checkoutModal.classList.add('hidden'));
  document.getElementById('checkout-form').addEventListener('submit', (e) => {
    e.preventDefault();
    document.getElementById('checkout-form').classList.add('hidden');
    document.getElementById('checkout-success').classList.remove('hidden');
    cart = [];
    renderCart();
  });

  // Newsletter
  document.getElementById('newsletter-form').addEventListener('submit', (e) => {
    e.preventDefault();
    document.getElementById('newsletter-success').classList.remove('hidden');
    e.target.reset();
  });

  // Catalog cards - gender selection
  document.querySelectorAll('.catalog-card').forEach(card => {
    const hasGender = card.dataset.hasGender === 'true';
    const overlay = card.querySelector('.gender-overlay');

    card.addEventListener('click', (e) => {
      if (e.target.closest('.gender-btn')) return;
      if (hasGender && overlay) {
        // Close other overlays
        document.querySelectorAll('.gender-overlay.active').forEach(o => {
          if (o !== overlay) o.classList.remove('active');
        });
        overlay.classList.toggle('active');
      } else {
        // Direct scroll for categories without gender
        const cat = card.dataset.catalog;
        const target = document.querySelector(`[data-cat-section="${cat}"]`);
        if (target) target.scrollIntoView({ behavior: 'smooth' });
      }
    });
  });

  // Gender buttons scroll to section
  document.querySelectorAll('.gender-btn').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      const target = btn.dataset.target;
      const section = document.querySelector(`[data-cat-section="${target}"]`);
      if (section) section.scrollIntoView({ behavior: 'smooth' });
      // Close overlay
      btn.closest('.gender-overlay').classList.remove('active');
    });
  });

  // Close gender overlays on outside click
  document.addEventListener('click', (e) => {
    if (!e.target.closest('.catalog-card')) {
      document.querySelectorAll('.gender-overlay.active').forEach(o => o.classList.remove('active'));
    }
  });

  lucide.createIcons();
  renderCart();
  </script>
